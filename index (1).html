<script>
(function () {
'use strict';
/* ===== L'EXPERT — noyau de l'application (un seul fichier) =====
   Registre de modules, routeur à base de « # » (une seule page index.html), cycle de vie des écrans,
   avis de mise à jour, enregistrement du service worker. Le moteur Nexus I et tous les écrans sont dans ce même fichier. */
const MODULES = Object.create(null), CACHE = Object.create(null), VIEWS = Object.create(null);
const def = (id, fn) => { MODULES[id] = fn; };
const defView = (name, meta, run) => { VIEWS[name] = { ...meta, run }; };
function req(id) {
  const hit = CACHE[id]; if (hit) return hit;
  const fn = MODULES[id]; if (!fn) throw new Error('Module introuvable : ' + id);
  const exp = CACHE[id] = Object.create(null);
  fn(exp, req, dyn);
  return exp;
}
const dyn = (id) => new Promise((ok, ko) => { try { ok(req(id)); } catch (e) { ko(e); } });
const __star = (to, from) => { for (const k of Object.keys(from)) if (k !== 'default' && !(k in to)) Object.defineProperty(to, k, { enumerable: true, get() { return from[k]; } }); };

/* ---------- suivi des écouteurs « document / window » et des enregistrements différés d'un écran ---------- */
const _st = window.setTimeout.bind(window), _ct = window.clearTimeout.bind(window);
let live = null;                       // enregistrement de l'écran affiché
const patchTarget = (t) => {
  const add = t.addEventListener.bind(t);
  t.addEventListener = (type, fn, opts) => { if (live) live.listeners.push([t, type, fn, opts]); return add(type, fn, opts); };
};
patchTarget(document); patchTarget(window);
/* Les enregistrements automatiques différés (≤ 500 ms) d'un écran sont exécutés tout de suite quand on le quitte :
   aucune saisie n'est perdue, et aucun enregistrement tardif ne peut écraser le travail de l'écran suivant. */
const pending = new Map();             // id de minuterie -> { rec, fn, args }
window.setTimeout = (fn, ms, ...args) => {
  if (!live || typeof fn !== 'function' || !(ms <= 500)) return _st(fn, ms, ...args);
  const rec = live; let id;
  id = _st(() => { pending.delete(id); fn(...args); }, ms);
  pending.set(id, { rec, fn, args }); return id;
};
window.clearTimeout = (id) => { pending.delete(id); _ct(id); };

  if (!live) return; const rec = live; live = null;
  for (const [id, t] of [...pending]) if (t.rec === rec) { pending.delete(id); _ct(id); try { const r = t.fn(...t.args); if (r && r.catch) r.catch(() => {}); } catch (e) { /* écran déjà quitté */ } }
  for (const [t, type, fn, opts] of rec.listeners) t.removeEventListener(type, fn, opts);
}

/* ---------- routeur : #/nom-ecran?parametres ---------- */
const appEl = document.getElementById('lx-root'), styleEl = document.getElementById('view-style');
function parseHash() {
  const h = location.hash.replace(/^#\/?/, ''); const i = h.indexOf('?');
  const name = (i < 0 ? h : h.slice(0, i)).replace(/\.html$/, '') || 'home';
  return { name: name === 'index' ? 'home' : name, search: i < 0 ? '' : h.slice(i) };
}
function nav(href) {
  const m = /^([^?#]*?)(?:\.html)?(\?[^#]*)?$/.exec(String(href)); if (!m) return;
  const name = m[1] === 'index' || m[1] === '' ? '' : m[1];
  const target = '#/' + name + (m[2] || '');
  if (location.hash === target || (!location.hash && target === '#/')) render(); else location.hash = target;
}
let token = 0;
async function render() {
  const { name, search } = parseHash();
  const view = VIEWS[name] || VIEWS.home;
  teardown();
  const mine = ++token;
  styleEl.textContent = view.css; appEl.innerHTML = view.html; document.title = view.title;
  window.scrollTo(0, 0);
  live = { listeners: [] };
  try { await view.run(req, dyn, nav, search); }
  catch (err) {
    if (mine !== token) return;
    console.error('[L’EXPERT]', err);
    const box = document.createElement('div'); box.style.cssText = 'margin:1rem;padding:1rem;border:2px solid #f85149;border-radius:1rem;background:#06173f;color:#f2f6ff;font:15px/1.4 "Segoe UI",Roboto,Arial,sans-serif';
    box.innerHTML = '<strong>Cet écran n’a pas pu s’ouvrir.</strong><p style="color:#9fb2d6;font-size:.85rem"></p><a href="#/" style="color:#e8b520">← Retour à l’accueil</a>';
    box.querySelector('p').textContent = String(err && err.message || err);
    appEl.prepend(box);
  }
}
window.addEventListener('hashchange', render);

/* ---------- avis « nouvelle version » + stockage protégé ---------- */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (document.getElementById('update-notice')) return;
    const box = document.createElement('div');
    box.id = 'update-notice'; box.setAttribute('role', 'status');
    box.style.cssText = 'position:fixed;left:50%;bottom:max(1rem,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;width:min(92vw,26rem);padding:.8rem 1rem;border:2px solid #e8b520;border-radius:1.2rem;background:#06173f;color:#f2f6ff;font:.95rem/1.35 "Segoe UI",Roboto,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.6)';
    const msg = document.createElement('div'); msg.textContent = 'Une nouvelle version de L’EXPERT est disponible.';
    const sub = document.createElement('p'); sub.style.cssText = 'margin:.3rem 0 .6rem;font-size:.82rem;color:#9fb2d6'; sub.textContent = 'Vos projets enregistrés sont conservés.';
    const mk = (label, act, primary) => { const b = document.createElement('button'); b.type = 'button'; b.dataset.act = act; b.textContent = label;
      b.style.cssText = 'font:inherit;cursor:pointer;border-radius:999px;padding:.45rem 1rem;margin-right:.5rem;font-weight:700;' + (primary ? 'background:#e8b520;color:#011636;border:0' : 'background:transparent;color:#e8b520;border:1px solid #e8b520'); return b; };
    const ok = mk('Actualiser', 'reload', true), later = mk('Plus tard', 'later', false);
    ok.addEventListener('click', () => location.reload()); later.addEventListener('click', () => box.remove());
    box.append(msg, sub, ok, later); document.body.appendChild(box);
  });
}

/* ---------- service worker (HTTPS ou localhost) : une erreur ne bloque jamais l'affichage ---------- */
if ('serviceWorker' in navigator && window.isSecureContext) {
  const reg = () => navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })

}

/* ===== modules (moteur Nexus I, planificateur, stockage local, écrans) ===== */
def("js/assistant-results.js", function (__exports, __req, __dyn) {

/* L'EXPERT — assistant de dimensionnement : affichage des résultats (comparaison A / B / C, détails, conseils). */


const LV = { critique: 'critique', attention: 'attention', info: 'info' };
const adviceHtml = (list) => list.map((a) => `<div class="item lvl-${LV[a.level] ?? 'info'}"><span class="tag ${a.level === 'critique' ? 't-miss' : a.level === 'attention' ? 't-alert' : 't-calc'}">${esc(a.topic)}</span>${esc(a.message)}${a.consequence ? `<br><span class="tiny">Conséquence : ${esc(a.consequence)}</span>` : ''}${a.action ? `<br><span class="tiny">À envisager : ${esc(a.action)}</span>` : ''}</div>`).join('');

  const fmt = (r, v) => v == null ? '—' : r.fmt === 'f' ? fc(v) : r.fmt === 'n' ? fn(v) + (r.unit ? ' ' + r.unit : '') : r.fmt === 'n1' ? fn(v, 1) + (r.unit ? ' ' + r.unit : '') : esc(v);

const basinNote = (i) => i.existingDeclared > 0 ? `${i.existingUsed} existant(s) utilisé(s) + ${i.toBuild} à construire` : '';

  const chrono = table(['Mois', 'Investissement', 'Dépenses d’exploitation', 'Encaissements', 'Cumul', 'Solde avec votre capital'], p.chrono.map((c) => [`${c.month}${c.beforeFirstSale ? '' : ''}${c.month === S.firstSaleMonth ? ' ★1re vente' : ''}`, fn(c.capexFcfa), fn(c.opexFcfa), fn(c.cashInFcfa), fn(c.cumulativeFcfa), `<span style="color:${c.balanceWithBudgetFcfa < 0 ? '#ffc9c9' : '#bff3df'}">${fn(c.balanceWithBudgetFcfa)}</span>`]), [1, 2, 3, 4, 5]);
  const prices = table(['Prix utilisé', 'Valeur', 'Origine', 'Provenance'], p.meta.prices.map((x) => [esc(x.label), `${fn(x.value)} ${esc(x.unit)}`, esc(x.originLabel), esc(x.provenance.text)]), [1]);
  const params = [...Object.entries(p.meta.params.broodstock).map(([k, v]) => ['Géniteurs · ' + k, v]), ...p.meta.params.stages.flatMap((s) => ['durationDays', 'survivalPct', 'densityPerM3', 'rationPct'].map((k) => [`${s.label} · ${k}`, s[k]]))];
  const hyp = table(['Paramètre', 'Valeur', 'Origine', 'Remarque'], params.map(([k, v]) => [esc(k), fn(v.value, 2), v.origin === 'reference' ? 'référence existante' : v.origin === 'utilisateur' ? 'modifié par vous' : 'hypothèse Nexus I', esc(v.note ?? '')]), [1]);
  const brood = table(['Géniteurs', 'Besoin', 'Déjà disponibles', 'À acheter', 'Prix unitaire', 'Total'], p.meta.brood.map((b) => [esc(b.label), b.need, b.owned, b.toBuy, fn(b.unitPriceFcfa), fn(b.totalFcfa)]), [1, 2, 3, 4, 5]);
  const eq = table(['Équipement', 'Priorité', 'Besoin', 'Déjà là', 'À acheter', 'Prix', 'Total'], p.meta.equipRows.map((e) => [esc(e.name), e.level, e.qty, e.owned, e.toBuy, fn(e.unitPriceFcfa), fn(e.totalFcfa)]), [2, 3, 4, 5, 6]);
  const levers = editable.map((l) => { const mod = Number.isFinite(overrides?.[k]?.[l.key]); const init = base?.plan?.meta?.levers?.[l.key] ?? p.meta.levers[l.key];
    return `<div class="field"><label>${esc(l.label)} <span class="u">(${esc(l.unit)})</span>${mod ? ' <span class="pill decl">modifié par vous</span>' : ''}</label><input type="number" step="any" inputmode="decimal" data-lev="${k}.${l.key}" value="${esc(overrides?.[k]?.[l.key] ?? p.meta.levers[l.key] ?? '')}"><p class="hint">Proposé par Nexus I : ${fn(init, 2)}</p></div>`; }).join('');
  const kpi = `<div class="kpi"><div><b>${fn(S.soldAlevins)}</b><span>alevins vendus dans la période</span></div><div><b>${fc(S.capexFcfa)}</b><span>investissement initial</span></div><div><b>${fn(S.costPerAlevinCashFcfa, 1)} F</b><span>coût de revient décaissé / alevin</span></div><div><b>${fc(S.resultFcfa)}</b><span>résultat prévisionnel (hypothèse)</span></div><div><b>${fc(S.requiredFcfa)}</b><span>capital nécessaire</span></div><div><b style="color:${S.sufficient ? '#bff3df' : '#ffc9c9'}">${fc(S.balanceFcfa)}</b><span>${S.sufficient ? 'capital restant' : 'déficit'}</span></div></div>`;
  return `<details><summary><b>Détail complet — scénario ${k} — ${esc(sc.title)}</b><br><span class="tiny">${esc(sc.goal)}</span></summary><div class="body">${kpi}

function recommendationHtml(rec, sc) {
  const S = sc[rec.preferred].plan.summary;
  return `<div class="rec ${S?.sufficient ? '' : 'warn'}"><strong>Recommandation de Nexus I : scénario ${rec.preferred} — ${esc(sc[rec.preferred].title)}</strong>${rec.reasons.map((r) => `<p>${esc(r)}</p>`).join('')}${rec.caveats.map((c) => `<p class="tiny">${esc(c)}</p>`).join('')}</div>`;

/* ===== Ajouts « parcours guidé » : statuts explicites, avantages / limites, cartes de scénarios, analyse, avant / après ===== */
/* Tout est LU dans les résultats du moteur Nexus I (plan.summary, plan.infra, plan.feed…) : aucune valeur n'est inventée ici. */
const STATUS = Object.freeze({
  atteint: { key: 'atteint', cls: 'ok', label: 'Objectif atteint' },
  partiel: { key: 'partiel', cls: 'part', label: 'Objectif partiellement réalisable' },
  non: { key: 'non', cls: 'no', label: 'Objectif non réalisable avec les contraintes actuelles' },
  impossible: { key: 'impossible', cls: 'na', label: 'Calcul impossible faute de données suffisantes' },
});
/** Statut d'un scénario par rapport à l'objectif DEMANDÉ par l'utilisateur (jamais par rapport à une cible déjà réduite). */
function statusOf(plan, objective) {
  const S = plan?.summary;
  if (!S || !plan.sim?.ok) { const why = (plan?.sim?.errors ?? []).map((e) => e.message).filter(Boolean).slice(0, 2).join(' ; '); return { ...STATUS.impossible, detail: why || 'Des données obligatoires manquent ou sont invalides : le moteur n’a pas pu calculer ce scénario.' }; }
  if (!(objective > 0)) return { ...STATUS.impossible, detail: 'Aucun objectif de production n’est renseigné.' };
  const sold = S.soldAlevins ?? 0, pct = Math.round(sold / objective * 100), fundable = S.sufficient === true;
  const miss = S.additionalFinancingFcfa > 0 ? fc(S.additionalFinancingFcfa) : '—';
  if (sold >= objective - 0.5 && fundable) return { ...STATUS.atteint, detail: `Nexus I calcule ${fn(sold)} alevins vendus pour ${fn(objective)} demandés, avec un capital suffisant.` };
  if (sold >= objective - 0.5) return { ...STATUS.non, detail: `La production demandée est calculable (${fn(sold)} alevins), mais le capital ne suffit pas : il manque environ ${miss}.` };
  if (sold > 0 && fundable) return { ...STATUS.partiel, detail: `Nexus I calcule ${fn(sold)} alevins vendus, soit ${pct} % des ${fn(objective)} demandés. Votre objectif n’a pas été modifié : c’est la production réalisable avec ces contraintes.` };
  if (sold > 0) return { ...STATUS.non, detail: `Seulement ${fn(sold)} alevins sur ${fn(objective)} demandés (${pct} %), et le capital ne suffit pas : il manque environ ${miss}.` };
  return { ...STATUS.non, detail: 'Aucun alevin ne serait vendu dans la période avec ces hypothèses.' };
}
const statusBadge = (st) => `<div class="st ${st.cls}" role="status"><b>${esc(st.label)}</b><span>${esc(st.detail)}</span></div>`;

/** Avantages et limites : uniquement des constats chiffrés issus du calcul ou des leviers réellement appliqués au scénario. */
function prosCons(k, sc, advice = []) {
  const P = sc[k].plan, S = P.summary;
  if (!S || !P.sim.ok) return { pros: [], cons: ['Le calcul de ce scénario n’a pas abouti.'] };
  const ks = ['A', 'B', 'C'].filter((x) => sc[x].plan.summary && sc[x].plan.sim.ok);
  const vals = (f) => ks.map((x) => f(sc[x].plan.summary));
  const isMin = (f) => ks.length > 1 && f(S) === Math.min(...vals(f)) && new Set(vals(f)).size > 1;
  const isMax = (f) => ks.length > 1 && f(S) === Math.max(...vals(f)) && new Set(vals(f)).size > 1;
  const L = P.meta.levers, pros = [], cons = [];
  if (S.sufficient) pros.push('Finançable avec votre capital.'); else cons.push(`Capital insuffisant : il manque environ ${fc(S.additionalFinancingFcfa)}.`);
  if (isMin((s) => s.capexFcfa)) pros.push('Investissement initial le plus bas des trois scénarios.');
  if (isMax((s) => s.capexFcfa)) cons.push('Investissement initial le plus élevé des trois scénarios.');
  if (isMax((s) => s.soldAlevins)) pros.push('Production vendue la plus élevée des trois.');
  if (isMin((s) => s.soldAlevins)) cons.push('Production vendue la plus faible des trois.');
  if (S.costPerAlevinCashFcfa != null && isMin((s) => s.costPerAlevinCashFcfa)) pros.push('Coût de revient décaissé par alevin le plus bas.');
  if (S.resultFcfa != null) { if (S.resultFcfa >= 0) pros.push('Résultat prévisionnel positif sur la période (hypothèse, pas une garantie).'); else cons.push('Résultat prévisionnel négatif sur la période avec ces prix.'); }
  if (k === 'A' && sc.A.limitedByBudget) cons.push(`Production ramenée à ${fn(S.target)} alevins pour tenir dans le capital.`);
  if (L.basinMarginPct >= 20) pros.push(`Marge de capacité sur les bassins (${fn(L.basinMarginPct)} %).`);
  if (L.spareBasinsPerKind > 0) pros.push('Un bassin de réserve par fonction.');
  if (L.backupGenerator) pros.push('Groupe électrogène de secours prévu.');
  if (L.technician) pros.push('Technicien prévu dans les charges.');
  if (L.densityFactor > 1) cons.push(`Densités d’élevage augmentées (× ${fn(L.densityFactor, 2)}) : moins de marge biologique.`);
  if (L.rightSize) cons.push('Dimensions des bassins ajustées au plus juste du besoin.');
  if (!(L.levels ?? []).includes('recommande')) cons.push('Équipements « recommandés » et « optionnels » non inclus.');
  const tight = (P.infra ?? []).filter((i) => i.utilizationPct != null && i.utilizationPct > 95).map((i) => i.label);
  if (tight.length) cons.push(`Bassins utilisés à plus de 95 % : ${tight.join(', ')}.`);
  const crit = advice.filter((a) => a.level === 'critique').length;
  if (crit) cons.push(`${crit} alerte${crit > 1 ? 's' : ''} critique${crit > 1 ? 's' : ''} de Nexus I (voir les conseils).`);
  return { pros, cons };
}
const ul = (list, empty) => list.length ? `<ul class="plain">${list.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : `<p class="tiny">${esc(empty)}</p>`;

/** Carte de synthèse d'un scénario (lisible sur téléphone). Le détail complet reste dans scenarioDetail(). */

const ROUTES = {

:#ffc9c9;font-style:italic}\n.item{border-left:3px solid #1d3568;padding:.2rem 0 .2rem .6rem;margin:.5rem 0;font-size:.9rem}\n.item.critical{border-color:#f85149}.item.warning{border-color:#f0883e}.item.info{border-color:#58a6ff}\n.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem}\n.kpi div{background:#0a2152;border-radius:.7rem;padding:.5rem .6rem}.kpi b{display:block;font-size:1.05rem}.kpi span{font-size:.78rem;color:#9fb2d6}\n.grey{opacity:.5}\n", html: "<div class=\"wrap\">\n  <a class=\"back\" href=\"#/\">← Accueil<\/a>\n  <h1>Nouveau projet<\/h1>\n  <p class=\"note\">Vous ne connaissez pas tous les prix ? <a class=\"back\" href=\"#/dimensionnement\">Assistant de dimensionnement intelligent →<\/a><\/p>\n  <p class=\"sub\" id=\"stepLine\"><\/p>\n  <div class=\"bar\" aria-hidden=\"true\"><i id=\"bar\"><\/i><\/div>\n  <div class=\"chips\" id=\"chips\" role=\"tablist\" aria-label=\"Étapes\"><\/div>\n  <div id=\"projbar\"><\/div>\n  <div id=\"notice\"><\/div>\n  <div id=\"content\"><\/div>\n<\/div>\n<div class=\"nav\"><button class=\"btn sec\" id=\"prev\" type=\"button\">← Précédent<\/button><button class=\"btn\" id=\"next\" type=\"button\">Suivant →<\/button><\/div>" }, async (__req, __dyn, __nav, __search) => {
'use strict';
const { STEPS, INVEST_STEPS, newState, get, set, buildProjectData, stageNames, stepForPath: stepForPathRaw } = __req("js/project-form.js");
const { simulate, getReferentials } = __req("js/nexus-bridge.js");
const { resultsHtml, financeStudyHtml, esc } = __req("js/results-view.js");
const { saveDraft, loadDraft, clearDraft } = __req("js/draft-store.js");
const { createProject, updateProjectState, getProject, addSimulation, summarizeSimulation } = __req("js/project-store.js");







const KEY = 'nouveau-projet';
const $ = (id) => document.getElementById(id);
let state = newState(), stepIdx = 0, saveTimer = null, lastRun = null, projectId = null, projectName = '';

/* Deux parcours sur les MÊMES données : « Nouveau projet » (biologie d'abord) et « Analyser mon investissement » (étude économique d'abord). */
const MODE = new URLSearchParams(__search).get('parcours') === 'investissement' ? 'invest' : 'standard';
const STEP_LIST = MODE === 'invest' ? INVEST_STEPS : STEPS;
const stepForPath = (p) => stepForPathRaw(p, MODE);
if (MODE === 'invest') { document.title = "Analyser mon investissement — L'EXPERT"; document.querySelector('h1').textContent = 'Analyser mon investissement'; }
const activeSteps = () => STEP_LIST.filter((s) => !s.showIf || s.showIf(state));
const cur = () => activeSteps()[Math.min(stepIdx, activeSteps().length - 1)];

/* ---------- rendu des champs ---------- */
function inputHtml(f, value, attrs) {
  const id = 'f' + Math.random().toString(36).slice(2, 8);
  const unit = f.unit ? ` <span class="u">(${esc(f.unit)})</span>` : '';
  const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : '';
  if (f.type === 'check') return `<div class="field check"><label><input type="checkbox" ${attrs} ${value ? 'checked' : ''}> ${esc(f.label)}</label>${hint}</div>`;
  let ctl;
  if (f.type === 'select') ctl = `<select id="${id}" ${attrs}><option value="">— choisir —</option>${f.options.map(([v, l]) => `<option value="${esc(v)}" ${value === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  else if (f.type === 'number') ctl = `<input id="${id}" type="number" inputmode="decimal" step="${f.step ?? 'any'}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} value="${value ?? ''}" ${attrs}>`;
  else ctl = `<input id="${id}" type="${f.type === 'date' ? 'date' : 'text'}" value="${esc(value ?? '')}" ${attrs}>`;
  return `<div class="field"><label for="${id}">${esc(f.label)}${unit}</label>${ctl}${hint}</div>`;
}
const fieldsHtml = (fields) => fields.filter((f) => !f.showIf || f.showIf(state)).map((f) => inputHtml(f, get(state, f.path), `data-p="${f.path}"`)).join('');

function listHtml(b) {
  const rows = get(state, b.path) ?? [];
  return `<h2>${esc(b.title)}</h2>` + rows.map((row, i) => `<div class="row"><h3><span>${esc(b.itemLabel)} ${i + 1}${row.name ? ' — ' + esc(row.name) : ''}</span><button type="button" class="btn danger small" data-del="${b.path}|${i}">Supprimer</button></h3>` +
    b.fields.filter((f) => !f.showRow || f.showRow(row)).map((f) => inputHtml(f.dynamicOptions ? { ...f, options: f.dynamicOptions(state) } : f, row[f.key], `data-l="${b.path}" data-i="${i}" data-k="${f.key}"`)).join('') + '</div>').join('') +
    `<button type="button" class="btn sec small" data-add="${b.path}">+ Ajouter : ${esc(b.itemLabel.toLowerCase())}</button>`;
}
/* alimentation : liste liée aux stades biologiques saisis */
const feedFields = (sp) => [
  { type: 'select', label: 'Stade biologique', key: 'biologyStage', options: stageNames(state, sp).map((n) => [n, n]), hint: stageNames(state, sp).length ? '' : 'Saisissez d\'abord les stades de cette espèce.' },
  { type: 'text', label: 'Type d\'aliment', key: 'feedType' },
  { type: 'select', label: 'Méthode', key: 'method', options: [['ration', 'Taux de ration (% de la biomasse / jour)'], ['fcr', 'Indice de conversion (FCR)']] },
  { type: 'select', label: 'Le taux / FCR porte sur l\'aliment…', key: 'basis', options: [['distributed', 'distribué (pertes déjà incluses)'], ['ingested', 'ingéré']] },
  { type: 'number', label: 'Ration', key: 'rationPct', unit: '% / jour', min: 0, max: 100, step: 'any', showRow: (r) => r.method === 'ration' },
  { type: 'number', label: 'FCR', key: 'fcr', unit: 'kg aliment / kg gain', min: 0, step: 'any', showRow: (r) => r.method === 'fcr' },
  { type: 'number', label: 'Pertes d\'aliment', key: 'lossPct', unit: '%', min: 0, max: 99, step: 'any', showRow: (r) => r.basis === 'ingested' },
  { type: 'number', label: 'Poids initial', key: 'initialWeightG', unit: 'g', min: 0, step: 'any' },
  { type: 'number', label: 'Poids final', key: 'finalWeightG', unit: 'g', min: 0, step: 'any' },
  { type: 'number', label: 'Prix', key: 'pricePerKg', unit: 'FCFA/kg', min: 0, step: 'any' },
  { type: 'number', label: 'Repas par jour (facultatif)', key: 'mealsPerDay', min: 0, step: 'any' },
];
function blockHtml(b) {
  if (b.showIf && !b.showIf(state)) return '';
  if (b.kind === 'fields') return `<div class="card">${b.title ? `<h2 style="margin-top:0">${esc(b.title)}</h2>` : ''}${fieldsHtml(b.fields)}</div>`;
  if (b.kind === 'list') return `<div class="card">${listHtml(b)}</div>`;
  if (b.kind === 'feed') {
    if (!state.species?.[b.species]) return '';
    const nm = b.species === 'clarias' ? 'Clarias' : 'Tilapia';
    return `<div class="card"><h2 style="margin-top:0">${nm}</h2>` +
      listHtml({ title: 'Stades alimentaires', path: `feed.${b.species}.stages`, itemLabel: 'Stade alimentaire', fields: feedFields(b.species) }) +
      listHtml({ title: 'Stocks d\'aliment existants (facultatif)', path: `feed.${b.species}.stock`, itemLabel: 'Stock', fields: [{ type: 'text', label: 'Type d\'aliment (même nom que ci-dessus)', key: 'type' }, { type: 'number', label: 'Quantité', key: 'kg', unit: 'kg', min: 0, step: 'any' }] }) + '</div>';
  }
  if (b.kind === 'stagecaps') {
    const parts = ['clarias', 'tilapia'].filter((sp) => state.species?.[sp]).map((sp) => {
      const names = stageNames(state, sp);
      return names.length ? `<p class="note"><b>${sp === 'clarias' ? 'Clarias' : 'Tilapia'}</b></p>` + names.map((n) => inputHtml({ type: 'number', label: n, unit: 'poissons', min: 0, step: 1 }, state.stageCaps?.[sp]?.[n], `data-sc="${sp}|${esc(n)}"`)).join('') : '';
    }).join('');
    return `<div class="card"><h2 style="margin-top:0">${esc(b.title)}</h2>${parts || '<p class="note">Saisissez d\'abord les stades biologiques.</p>'}<p class="note">Capacité maximale que l\'infrastructure peut accueillir (facultatif). Laissée vide : « non évaluée ».</p></div>`;
  }
  if (b.kind === 'recap') return recapHtml();
  if (b.kind === 'invstudy') return studyHtml();
  return '';
}

/* ---------- vérification ---------- */
function studyHtml() {
  const pd = buildProjectData(state);
  return `<div class="card"><p class="note">Cette étude utilise le même moteur Nexus I que « Nouveau projet » : mêmes données, mêmes formules. Elle chiffre l'investissement, les dépenses, le fonds de roulement, le coût de production, le chiffre d'affaires potentiel, la rentabilité, les besoins de financement et la trésorerie.</p>
    <p class="note"><b>Résumé :</b> ${esc(pd.project?.name ?? '(sans nom)')} · ${esc((pd.project?.species ?? []).join(' + ') || 'aucune espèce')} · ${pd.project?.months ?? '?'} mois</p>
    <div class="field"><label for="rate">Taux d'actualisation annuel (%), facultatif</label><input id="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="vide = pas de VAN/TRI"></div>
    <button class="btn" id="run" type="button">Calculer l'étude économique</button></div><div id="result"></div>`;
}
function recapHtml() {
  const pd = buildProjectData(state);
  const refs = getReferentials();
  return `<div class="card"><p class="note">Nexus I va calculer à partir de ce que vous avez saisi. Les champs vides restent vides : ils seront listés comme données manquantes.</p>
    <p class="note"><b>Résumé :</b> ${esc(pd.project?.name ?? '(sans nom)')} · ${esc((pd.project?.species ?? []).join(' + ') || 'aucune espèce')} · ${pd.project?.months ?? '?'} mois</p>
    <div class="field"><label for="rate">Taux d'actualisation annuel (%), facultatif</label><input id="rate" type="number" min="0" step="any" inputmode="decimal" placeholder="vide = pas de VAN/TRI"></div>
    <div class="field"><label>Comparer avec les références de (facultatif)</label><div id="countries">${refs.map((c) => `<label class="${c.referencesCount ? '' : 'grey'}" style="margin-right:.7rem"><input type="checkbox" value="${esc(c.country)}" ${c.referencesCount ? '' : 'disabled'}> ${esc(c.country)} (${c.referencesCount})</label>`).join('')}</div><p class="hint">Les références comparent, elles ne remplacent jamais vos valeurs.</p></div>
    <button class="btn" id="run" type="button">Vérifier et calculer avec Nexus I</button></div><div id="result"></div>`;
}
function runCheck() {
  const pd = buildProjectData(state);
  const countries = [...document.querySelectorAll('#countries input:checked')].map((i) => i.value);
  const opt = {};
  if (countries.length) opt.referenceSelection = { countries, species: pd.project?.species ?? [], includeOtherOrigins: false };
  const rate = $('rate').value.trim(); if (rate !== '' && Number(rate) >= 0) opt.finance = { discountRateAnnualPct: Number(rate) };
  const res = simulate(pd, opt); lastRun = res;
  if (projectId) addSimulation(projectId, summarizeSimulation(res)).catch(() => {});
  const out = $('result');
  const r = res.raw;
  let html = '';
  if (r) {
    const blocking = [...(r.errors ?? []).map((e) => ({ path: e.path, text: e.message, kind: 'Erreur' })), ...(r.missing ?? []).filter((m) => m.blocking).map((m) => ({ path: m.path, text: m.message, kind: 'Manque' }))];
    if (blocking.length) html += `<div class="card"><h2 style="margin-top:0">À corriger pour que le calcul aboutisse (${blocking.length})</h2>` + blocking.map((b, i) => `<div class="item critical"><b>${b.kind}</b> — ${esc(b.text)}<div class="note">${esc(b.path ?? '')}</div><button type="button" class="btn sec small" data-goto="${stepForPath(b.path)}">Aller à l'étape « ${esc(STEP_LIST.find((s) => s.id === stepForPath(b.path))?.title)} »</button></div>`).join('') + '</div>';
  }
  html += MODE === 'invest' ? financeStudyHtml(res, { ...pd, __fictif: false }) : resultsHtml(res, { ...pd, __fictif: false });
  if (r) html += '<div class="card"><p class="note">Pour comparer des scénarios (prudent, central, favorable…), tester la sensibilité et lire les résultats par rubrique :</p><button type="button" class="btn" id="analyse">Ouvrir l\'analyse détaillée</button></div>';
  out.innerHTML = html; out.scrollIntoView({ behavior: 'smooth' });
}

/* ---------- affichage général ---------- */
function render() {
  const steps = activeSteps(); if (stepIdx >= steps.length) stepIdx = steps.length - 1;
  const s = steps[stepIdx];
  $('stepLine').textContent = `Étape ${stepIdx + 1} sur ${steps.length} — ${s.title}`;
  $('bar').style.width = ((stepIdx + 1) / steps.length * 100) + '%';
  $('chips').innerHTML = steps.map((x, i) => `<button type="button" role="tab" class="chip ${i === stepIdx ? 'on' : ''}" aria-selected="${i === stepIdx}" data-step="${i}">${i + 1}. ${esc(x.title)}</button>`).join('');
  $('content').innerHTML = `<p class="note">${esc(s.intro ?? '')}</p>` + s.blocks.map(blockHtml).join('');
  $('prev').disabled = stepIdx === 0; $('next').style.display = stepIdx === steps.length - 1 ? 'none' : '';
}
const go = (i) => { stepIdx = i; render(); window.scrollTo(0, 0); };

/* Brouillon + (si le brouillon est lié à un projet enregistré) mise à jour automatique du projet. */
async function flush() {
  await saveDraft(KEY, { state, stepId: cur().id, projectId });
  if (projectId) {
    const p = await updateProjectState(projectId, state).catch(() => null);
    if (p) { if (p.name !== projectName) { projectName = p.name; drawProjBar(); } }
    else { projectId = null; await saveDraft(KEY, { state, stepId: cur().id, projectId: null }); drawProjBar(); }   // projet supprimé ailleurs
  }
}
function persist() { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 400); }
function drawProjBar() {
  $('projbar').innerHTML = projectId
    ? `<div class="banner">Projet « ${esc(projectName)} » — enregistré automatiquement à chaque modification. <a class="back" href="#/mes-projets">Mes projets</a></div>`
    : `<div class="banner">Brouillon non enregistré comme projet. <button type="button" class="btn small" id="saveproj">Enregistrer comme projet</button> <a class="back" href="#/mes-projets">Mes projets</a></div>`;
}

/* ---------- événements ---------- */
const parse = (el) => el.type === 'checkbox' ? el.checked : el.type === 'number' ? (el.value === '' ? undefined : Number(el.value)) : (el.value === '' ? undefined : el.value);
function onChange(e, structural) {
  const el = e.target;
  if (el.dataset.p !== undefined) set(state, el.dataset.p, parse(el));
  else if (el.dataset.l !== undefined) { const arr = get(state, el.dataset.l) ?? []; set(arr[+el.dataset.i], el.dataset.k, parse(el)); }
  else if (el.dataset.sc !== undefined) { const [sp, n] = el.dataset.sc.split('|'); state.stageCaps ??= {}; state.stageCaps[sp] ??= {}; set(state.stageCaps[sp], n, parse(el)); }
  else return;
  persist();
  if (structural) { const y = window.scrollY; render(); window.scrollTo(0, y); }
}
document.addEventListener('input', (e) => { if (e.target.type === 'number' || e.target.type === 'text') onChange(e, false); });
document.addEventListener('change', (e) => { if (e.target.closest('#content') && !e.target.closest('#countries') && e.target.id !== 'rate') onChange(e, e.target.tagName === 'SELECT' || e.target.type === 'checkbox' || e.target.dataset.k === 'name' || e.target.dataset.p?.endsWith('.name')); });
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.step !== undefined) return go(+t.dataset.step);
  if (t.dataset.goto) { const i = activeSteps().findIndex((s) => s.id === t.dataset.goto); return go(i < 0 ? 0 : i); }
  if (t.dataset.add) {
    const p = t.dataset.add; let list = get(state, p);
    if (!Array.isArray(list)) { set(state, p, []); list = get(state, p); }
    list.push(/^(clarias|tilapia)\.stages$/.test(p) ? { rateKind: 'survivalPct' } : {});
    persist(); const y = scrollY; render(); scrollTo(0, y); return;
  }
  if (t.dataset.del) { const [p, i] = t.dataset.del.split('|'); if (confirm('Supprimer cet élément ?')) { get(state, p).splice(+i, 1); persist(); const y = scrollY; render(); scrollTo(0, y); } return; }
  if (t.id === 'run') return runCheck();
  if (t.id === 'analyse') { clearTimeout(saveTimer); return flush().then(() => { __nav('resultats.html'); }); }
  if (t.id === 'saveproj') { const nm = prompt('Nom du projet :', state.project?.name ?? ''); if (nm && nm.trim()) { state.project ??= {}; state.project.name = nm.trim(); createProject(state, nm.trim()).then((p) => { projectId = p.id; projectName = p.name; return flush(); }).then(() => { drawProjBar(); render(); }).catch(() => alert('Enregistrement impossible : le stockage local est indisponible.')); } return; }
  if (t.id === 'prev') return go(Math.max(0, stepIdx - 1));
  if (t.id === 'next') return go(Math.min(activeSteps().length - 1, stepIdx + 1));
});

/* ---------- démarrage : restauration du brouillon ---------- */
(async () => {
  const d = await loadDraft(KEY);
  if (d?.value?.state) {
    state = d.value.state;
    if (d.value.projectId) { const p = await getProject(d.value.projectId).catch(() => null); if (p) { projectId = p.id; projectName = p.name; } }
    const i = activeSteps().findIndex((s) => s.id === d.value.stepId); stepIdx = i < 0 ? 0 : i;
    $('notice').innerHTML = `<div class="banner">${projectId ? 'Projet rouvert' : 'Brouillon restauré'} (${esc(new Date(d.savedAt).toLocaleString('fr-FR'))}). <button type="button" class="btn danger small" id="reset">Recommencer à zéro</button><div class="hint">${projectId ? 'Le projet enregistré n\'est pas supprimé : seul le formulaire est vidé et détaché de ce projet.' : 'Le brouillon sera effacé.'}</div></div>`;
    $('reset').addEventListener('click', async () => { if (confirm('Vider le formulaire' + (projectId ? ' (le projet enregistré est conservé dans Mes projets)' : ' (brouillon effacé définitivement)') + ' ?')) { await clearDraft(KEY); state = newState(); stepIdx = 0; projectId = null; projectName = ''; $('notice').innerHTML = ''; drawProjBar(); render(); } });
  }
  drawProjBar(); render();

const TABS = [['synthese', 'Synthèse'], ['production', 'Production'], ['intrants', 'Aliments et énergie'], ['infra', 'Infrastructures'], ['finance', 'Finance'], ['scenarios', 'Scénarios'], ['sensibilite', 'Sensibilité'], ['alertes', 'Alertes et conseils'], ['donnees', 'Données et hypothèses']];
const GROUP = [['Projet saisi', 'donnees'], ['Production', 'production'], ['Besoins et coût', 'intrants'], ['Besoins énergétiques', 'intrants'], ['Capacités', 'infra'], ['Investissement', 'finance'], ['Charges', 'finance'], ['Chiffre', 'finance'], ['Fonds de roulement', 'finance'], ['VAN', 'finance'], ['Résultats financiers', 'finance'], ['Alertes', 'alertes'], ['Conseils', 'alertes'], ['Données manquantes', 'donnees'], ['Hypothèses', 'donnees']];
/* Scénarios et sensibilité sont rendus ici avec leur éditeur : on ignore les sections génériques correspondantes. */
const SKIP = ['Scénarios', 'Analyse de sensibilité'];

const persist = () => { clearTimeout(saveTimer); saveTimer = setTimeout(async () => { await saveDraft(KEY, { state, stepId, projectId }); if (projectId) await updateProjectState(projectId, state).catch(() => {}); }, 400); };

/* ---------- synthèse ---------- */
function synthese() {
  const r = res.raw, v = res.view, R = r.results ?? {}, fin = R.financial;
  const kpi = (b, l) => `<div><b>${b}</b><span>${esc(l)}</span></div>`;
  let h = `<div class="card"><h2 style="margin-top:0">${R.biology?.clarias || R.biology?.tilapia ? T.calc : T.miss} Production prévisionnelle</h2>`;
  const rows = ['clarias', 'tilapia'].filter((s) => R.biology?.[s]).map((s) => { const b = R.biology[s]; return `<tr><td>${s === 'clarias' ? 'Clarias' : 'Tilapia'}</td><td class="n">${n0(b.sellableWithinPeriod)}</td><td class="n">${n0(b.soldAlevins)}</td><td class="n">${n0(b.unsoldAlevins)}</td></tr>`; }).join('');
  h += rows ? `<div class="scroll"><table><thead><tr><th>Espèce</th><th class="n">Vendables</th><th class="n">Vendus</th><th class="n">Invendus</th></tr></thead><tbody>${rows}</tbody></table></div>` : absent('Production non calculée : données biologiques invalides ou incomplètes.');
  h += '</div>';
  h += `<div class="card"><h2 style="margin-top:0">${fin ? T.calc : T.miss} Résultats financiers</h2>`;
  if (fin) {
    const pr = fin.profitability.consolidated, cc = fin.productionCost.consolidated, cf = fin.cashFlow, pb = cf.payback;
    h += `<div class="kpi">${kpi(fc(R.investment?.initialInvestmentFcfa), 'investissement initial')}${kpi(fc(pr.revenueFcfa), 'chiffre d\'affaires')}${kpi(fc(cc.cashCostTotalFcfa), 'charges décaissées')}${kpi(fc(pr.resultAfterFinancialChargesFcfa), 'résultat économique')}${kpi(fc(R.workingCapital?.maxTotalFinancingNeedFcfa), 'déficit cumulé maximal (investissements inclus)')}${kpi(fc(cf.cumulativeEndFcfa), 'trésorerie cumulée en fin de période')}${kpi(pb.recovered ? 'mois ' + n0(pb.month) : 'non récupéré', 'délai de récupération')}</div><p class="note">Estimations issues de vos hypothèses, non validées scientifiquement.</p>`;
  } else h += absent(v.financialAbsentReason) + '<p class="note">Corrigez les points listés dans l\'onglet « Données et hypothèses » puis recalculez.</p>';
  h += '</div>';
  const a = r.alerts ?? [], c = a.filter((x) => x.level === 'critical').length, w = a.filter((x) => x.level === 'warning').length;
  h += `<div class="card"><h2 style="margin-top:0">${T.alert} Points d'attention</h2><div class="kpi">${kpi(c, 'alertes critiques')}${kpi(w, 'à surveiller')}${kpi((r.missing ?? []).filter((m) => m.blocking).length, 'données bloquantes manquantes')}${kpi(v.unvalidatedCount, 'paramètres non validés')}</div></div>`;
  return h;
}

/* ---------- scénarios ---------- */
const MODES = [['value', 'remplacer par'], ['multiplyBy', 'multiplier par'], ['add', 'ajouter']];
const modeOf = (o) => o.mode ?? 'value';                       /* état du formulaire : { path, mode, amount } */
const engineMode = (o) => MODES.find(([m]) => m in o)?.[0] ?? 'value'; /* forme moteur : { path, value|multiplyBy|add } */
function scenarioEditor() {
  const leaves = numericLeaves(pd); const sc = state.scenarios ?? {};
  const optsHtml = (cur) => `<option value="">— paramètre —</option>` + leaves.map((l) => `<option value="${esc(l.path)}" ${l.path === cur ? 'selected' : ''}>${esc(l.label)} (actuel : ${esc(l.value)})</option>`).join('') + (cur && !leaves.some((l) => l.path === cur) ? `<option value="${esc(cur)}" selected>${esc(cur)} (introuvable)</option>` : '');
  let h = `<div class="card"><h2 style="margin-top:0">${T.in} Définir mes scénarios</h2><p class="note">Un scénario est un jeu d'hypothèses que vous choisissez : Nexus I n'en invente aucun et n'y associe aucune probabilité. Un scénario sans modification reprend vos valeurs. Les modifications incomplètes sont ignorées.</p>`;
  for (const [k, d] of Object.entries(sc)) {
    h += `<div class="row"><h3><span>Scénario</span><button type="button" class="btn danger small" data-delsc="${esc(k)}">Supprimer</button></h3><div class="field"><label>Nom</label><input type="text" value="${esc(d.label ?? '')}" data-scl="${esc(k)}"></div>`;
    (d.overrides ?? []).forEach((o, i) => { const m = modeOf(o);
      h += `<div class="row" style="background:#06173f"><div class="field"><select data-so="${esc(k)}|${i}|path">${optsHtml(o.path)}</select></div><div class="field"><select data-so="${esc(k)}|${i}|mode">${MODES.map(([v, l]) => `<option value="${v}" ${v === m ? 'selected' : ''}>${l}</option>`).join('')}</select></div><div class="field"><input type="number" step="any" inputmode="decimal" value="${o.amount ?? ''}" data-so="${esc(k)}|${i}|amount"></div><button type="button" class="btn danger small" data-delso="${esc(k)}|${i}">Retirer</button></div>`; });
    h += `<button type="button" class="btn sec small" data-addso="${esc(k)}">+ Ajouter une modification</button></div>`;
  }
  return h + `<button type="button" class="btn sec small" data-addsc="1">+ Ajouter un scénario</button><p class="note">Puis appuyez sur « Recalculer » en haut de page.</p></div>`;
}
function scenarioResults() {
  const sc = res.raw?.scenarios;
  if (!sc) return `<div class="card">${absent('Aucun scénario défini.')}</div>`;
  if (sc.skipped) return `<div class="card">${T.miss} ${absent(sc.skipped)}</div>`;
  const keys = Object.keys(sc); const ok = keys.filter((k) => sc[k].indicators);
  const base = res.raw.results?.financial; let h = '<div class="card"><h2 style="margin-top:0">' + T.calc + ' Comparaison</h2>';
  const cols = [{ label: 'Votre saisie', ind: base ? { soldExternalAlevins: base.profitability.consolidated.soldExternalAlevins, revenueFcfa: base.profitability.consolidated.revenueFcfa, cashCostTotalFcfa: base.productionCost.consolidated.cashCostTotalFcfa, resultAfterFinancialChargesFcfa: base.profitability.consolidated.resultAfterFinancialChargesFcfa, cumulativeCashEndFcfa: base.cashFlow.cumulativeEndFcfa, paybackMonth: base.cashFlow.payback.month, paybackRecovered: base.cashFlow.payback.recovered, additionalFinancingNeedMaxFcfa: base.cashFlow.additionalFinancingNeedMaxFcfa, criticalAlerts: (res.raw.alerts ?? []).filter((a) => a.level === 'critical').length } : null }, ...ok.map((k) => ({ label: sc[k].label ?? k, ind: sc[k].indicators }))];
  const line = (name, fn) => `<tr><td class="s">${name}</td>${cols.map((c) => `<td class="n">${c.ind ? fn(c.ind) : '—'}</td>`).join('')}</tr>`;
  h += `<div class="scroll"><table><thead><tr><th>Indicateur</th>${cols.map((c) => `<th class="n">${esc(c.label)}</th>`).join('')}</tr></thead><tbody>` +
    line('Alevins vendus', (i) => n0(i.soldExternalAlevins)) + line('Chiffre d\'affaires', (i) => fc(i.revenueFcfa)) + line('Charges décaissées', (i) => fc(i.cashCostTotalFcfa)) + line('Résultat économique', (i) => fc(i.resultAfterFinancialChargesFcfa)) +
    line('Trésorerie fin de période', (i) => fc(i.cumulativeCashEndFcfa)) + line('Récupération', (i) => i.paybackRecovered ? 'mois ' + n0(i.paybackMonth) : 'non récupéré') + line('Financement manquant (après financement initial saisi)', (i) => fc(i.additionalFinancingNeedMaxFcfa)) + line('Alertes critiques', (i) => n0(i.criticalAlerts)) + '</tbody></table></div>';
  for (const k of keys) { const s = sc[k];
    h += `<p class="note"><b>${esc(s.label ?? k)}</b> — hypothèses : ` + ((s.hypotheses ?? []).length ? (s.hypotheses).map((o) => { const m = engineMode(o); return `${esc(describePath(pd, o.path))} → ${MODES.find((x) => x[0] === m)[1]} ${esc(o[m])}`; }).join(' ; ') : 'aucune modification (valeurs saisies)') + '</p>';
    if (s.errors?.length) h += s.errors.map((e) => `<div class="item critical">${esc(e.message)}</div>`).join('');
    else if (s.ok === false) h += `<div class="item warning">Calcul incomplet pour ce scénario${(s.missing ?? []).length ? ' : ' + s.missing.map(esc).join(', ') : ''}.</div>`; }
  return h + '<p class="note">Jeux d\'hypothèses explicites, sans probabilité : ce ne sont pas des prévisions.</p></div>';
}
function sensitivityHtml() {
  const edit = `<div class="card"><h2 style="margin-top:0">${T.in} Variation testée</h2><div class="field"><label for="delta">Variation de chaque paramètre (%)</label><input id="delta" type="number" min="0" step="any" inputmode="decimal" value="${state.sensitivity?.deltaPct ?? ''}" data-delta="1"><p class="hint">Chaque paramètre est augmenté puis diminué de ce pourcentage, un à la fois. Vide : pas d'analyse. Puis « Recalculer ».</p></div></div>`;
  const s = res.raw?.sensitivity; let h = '';
  if (!s) h = `<div class="card">${absent('Analyse de sensibilité non demandée.')}</div>`;
  else if (s.skipped) h = `<div class="card">${T.miss} ${absent(s.skipped)}</div>`;
  else if (s.ok === false) h = `<div class="card">${absent(s.error)}</div>`;
  else {
    const rows = s.ranking.slice(0, 10).map((p) => s.rows.find((x) => x.path === p));
    h = `<div class="card"><h2 style="margin-top:0">${T.calc} Paramètres les plus influents sur le résultat</h2><div class="scroll"><table><thead><tr><th>Paramètre</th><th class="n">−${n1(s.deltaPct)} %</th><th class="n">+${n1(s.deltaPct)} %</th></tr></thead><tbody>` +
      rows.map((r) => `<tr><td class="s">${esc(describePath(pd, r.path))}<div class="hint">valeur saisie : ${esc(r.baseValue)}</div></td><td class="n">${fc(r.resultDeltaLowFcfa)}</td><td class="n">${fc(r.resultDeltaHighFcfa)}</td></tr>`).join('') + `</tbody></table></div><p class="note">Variation du résultat économique par rapport à votre saisie, un paramètre à la fois. ${esc(s.note ?? '')}</p>` +
      ((s.rows.filter((r) => r.skipped).length) ? `<p class="note">${s.rows.filter((r) => r.skipped).length} paramètre(s) ignoré(s) (valeur introuvable).</p>` : '') + '</div>';
  }
  return edit + h;
}

/* ---------- données manquantes à corriger ---------- */
function toFix() {
  const r = res.raw; if (!r) return '';
  const b = [...(r.errors ?? []).map((e) => ({ t: e.message, p: e.path })), ...(r.missing ?? []).filter((m) => m.blocking).map((m) => ({ t: m.message, p: m.path }))];
  return b.length ? `<div class="card"><h2 style="margin-top:0">${T.miss} À corriger pour que le calcul aboutisse (${b.length})</h2>${b.map((x) => `<div class="item critical">${esc(x.t)}<div class="note">${esc(x.p ?? '')}</div></div>`).join('')}<a class="btn sec small" style="text-decoration:none;display:inline-block" href="#/nouveau-projet">Ouvrir le formulaire</a></div>` : '';
}

/* ---------- assemblage ---------- */
function compute() {
  pd = buildProjectData(state);
  const countries = [...document.querySelectorAll('#countries input:checked')].map((i) => i.value);
  const opt = {};
  if (countries.length) opt.referenceSelection = { countries, species: pd.project?.species ?? [], includeOtherOrigins: false };
  const rate = $('rate').value.trim(); if (rate !== '' && Number(rate) >= 0) opt.finance = { discountRateAnnualPct: Number(rate) };
  res = simulate(pd, opt);
  $('projLine').textContent = `${pd.project?.name ?? '(projet sans nom)'} · ${(pd.project?.species ?? []).join(' + ') || 'aucune espèce'} · ${pd.project?.months ?? '?'} mois`;
  const tmp = document.createElement('div'); tmp.innerHTML = resultsHtml(res, { ...pd, __fictif: false });
  const panels = Object.fromEntries(TABS.map(([id]) => [id, '']));
  let statusHtml = '';
  for (const el of tmp.children) {
    if (el.classList.contains('status')) { statusHtml = el.outerHTML; continue; }
    const title = el.querySelector('summary h2')?.textContent ?? '';
    if (SKIP.some((s) => title.startsWith(s))) continue;
    const g = GROUP.find(([k]) => title.startsWith(k))?.[1] ?? 'donnees';
    panels[g] += el.outerHTML.replace('<details>', '<details open>');
  }
  if (res.interfaceError) statusHtml = tmp.innerHTML;
  $('status').innerHTML = statusHtml;
  panels.synthese = res.raw ? synthese() : '';
  panels.scenarios = (res.raw ? scenarioEditor() + scenarioResults() : '');
  panels.sensibilite = res.raw ? sensitivityHtml() : '';
  panels.donnees = toFix() + panels.donnees;
  for (const [id] of TABS) if (!panels[id]) panels[id] = `<div class="card">${absent('Rien à afficher pour cette rubrique avec les données actuelles.')}</div>`;
  $('panels').innerHTML = TABS.map(([id]) => `<section id="p-${id}" role="tabpanel" ${id === tab ? '' : 'hidden'}>${panels[id]}</section>`).join('');
}
function drawTabs() { $('tabs').innerHTML = TABS.map(([id, l]) => `<button type="button" role="tab" class="chip ${id === tab ? 'on' : ''}" aria-selected="${id === tab}" data-tab="${id}">${esc(l)}</button>`).join(''); }

/* ---------- événements ---------- */
const mutate = (fn, recompute = true) => { fn(); persist(); if (recompute) { const y = scrollY; compute(); scrollTo(0, y); } };
document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; drawTabs(); document.querySelectorAll('#panels section').forEach((s) => { s.hidden = s.id !== 'p-' + tab; }); return; }
  if (t.id === 'run') { compute(); if (projectId && res) addSimulation(projectId, summarizeSimulation(res)).catch(() => {}); return; }
  if (t.dataset.addsc) return mutate(() => { state.scenarios ??= {}; let n = 1; while (state.scenarios['s' + n]) n++; state.scenarios['s' + n] = { label: 'Scénario ' + n, overrides: [] }; });
  if (t.dataset.delsc && confirm('Supprimer ce scénario ?')) return mutate(() => { delete state.scenarios[t.dataset.delsc]; });
  if (t.dataset.addso) return mutate(() => { state.scenarios[t.dataset.addso].overrides.push({ path: '' }); });
  if (t.dataset.delso) { const [k, i] = t.dataset.delso.split('|'); return mutate(() => { state.scenarios[k].overrides.splice(+i, 1); }); }
});
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.scl !== undefined) return mutate(() => { state.scenarios[el.dataset.scl].label = el.value; }, false);
  if (el.dataset.delta) return mutate(() => { state.sensitivity ??= {}; el.value === '' ? delete state.sensitivity.deltaPct : (state.sensitivity.deltaPct = Number(el.value)); }, false);
  if (el.dataset.so && el.type === 'number') { const [k, i] = el.dataset.so.split('|'); return mutate(() => { const o = state.scenarios[k].overrides[+i]; if (el.value === '') delete o.amount; else o.amount = Number(el.value); }, false); }
});
document.addEventListener('change', (e) => {
  const el = e.target; if (!el.dataset.so || el.type === 'number') return;
  const [k, i, f] = el.dataset.so.split('|');
  mutate(() => { const o = state.scenarios[k].overrides[+i];
    if (f === 'path') o.path = el.value;
    if (f === 'mode') o.mode = el.value; }, false);
});

(async () => {
  const d = await loadDraft(KEY);
  if (!d?.value?.state) { $('projLine').textContent = ''; $('empty').innerHTML = '<div class="card"><p>Aucun projet en cours : renseignez d\'abord un projet.</p><a class="btn" style="text-decoration:none;display:inline-block" href="#/nouveau-projet">Ouvrir « Nouveau projet »</a></div>'; return; }
  state = d.value.state; stepId = d.value.stepId ?? 'verification';
  if (d.value.projectId) { const p = await getProject(d.value.projectId).catch(() => null); if (p) projectId = p.id; }
  $('countries').innerHTML = getReferentials().map((c) => `<label class="${c.referencesCount ? '' : 'grey'}" style="margin-right:.7rem"><input type="checkbox" value="${esc(c.country)}" ${c.referencesCount ? '' : 'disabled'}> ${esc(c.country)} (${c.referencesCount})</label>`).join('');
  $('projbar').innerHTML = projectId ? '<div class="banner">Projet enregistré : vos scénarios et leurs modifications y sont conservés. Chaque « Recalculer » ajoute un résumé dans <a class="back" href="#/mes-projets">Mes projets</a>.</div>' : '<div class="banner">Brouillon non enregistré comme projet : ouvrez le <a class="back" href="#/nouveau-projet">formulaire</a> pour l\'enregistrer.</div>';
  $('main').hidden = false; drawTabs(); compute();
})();

});

ansparent;color:#e8b520;border:1px solid #e8b520}\n.btn.small{padding:.25rem .7rem;font-size:.8rem}\n.btn:disabled{opacity:.4}\n.btn.danger{background:transparent;color:#ffc9c9;border:1px solid #a33}\n.nav{position:fixed;left:0;right:0;bottom:0;background:#011636;border-top:1px solid #1d3568;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom));display:flex;gap:.6rem;justify-content:space-between;max-width:46rem;margin:0 auto}\n.note{color:#9fb2d6;font-size:.82rem;margin:.4rem 0}\n.banner{border:1px solid #e8b520;border-radius:.8rem;padding:.5rem .7rem;font-size:.85rem;margin:.5rem 0;background:#06173f}\n:focus-visible{outline:3px solid #e8b520;outline-offset:2px}\n/* styles des résultats (js/results-view.js) */\n.status{border-width:2px}.status.info{border-color:#e8b520}.status.warn{border-color:#f0883e}.status.bad{border-color:#f85149}.status.ok{border-color:#3fb950}\n.status strong{display:block;font-size:1rem;margin-bottom:.3rem}.status>div{font-size:.88rem}\n.tag{display:inline-block;font-size:.7rem;letter-spacing:.03em;text-transform:uppercase;border-radius:.5rem;padding:.1rem .5rem;margin-right:.4rem;vertical-align:middle}\n.t-in{background:#17356f;color:#cfe0ff}.t-calc{background:#0f4a3a;color:#bff3df}.t-alert{background:#6b3a05;color:#ffd9a8}\n.t-hyp{background:#33384a;color:#d6dbea}.t-adv{background:#4a1f5e;color:#ecd0fa}.t-miss{background:#5a1d1d;color:#ffc9c9}\ndetails{background:#06173f;border:1px solid #1d3568;border-radius:1rem;margin:.7rem 0}\nsummary{cursor:pointer;padding:.8rem .9rem;list-style:none}summary::-webkit-details-marker{display:none}\nsummary::after{content:\"▾\";float:right;color:#e8b520}details[open]>summary::after{content:\"▴\"}\n.body{padding:0 .9rem .9rem}\ntable{width:100%;border-collapse:collapse;font-size:.88rem}th,td{text-align:left;padding:.3rem .2rem;border-bottom:1px solid #12285a;vertical-align:top}\ntd.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.scroll{overflow-x:auto}\n.absent{color:#ffc9c9;font-style:italic}\n.item{border-left:3px solid #1d3568;padding:.2rem 0 .2rem .6rem;margin:.5rem 0;font-size:.9rem}\n.item.critical{border-color:#f85149}.item.warning{border-color:#f0883e}.item.info{border-color:#58a6ff}\n.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem}\n.kpi div{background:#0a2152;border-radius:.7rem;padding:.5rem .6rem}.kpi b{display:block;font-size:1.05rem}.kpi span{font-size:.78rem;color:#9fb2d6}\n.grey{opacity:.5}\n\n.chips{flex-wrap:wrap}\n.legend{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin:.4rem 0}\n.mini{font-size:.8rem}\nth.s,td.s{white-space:normal;min-width:7rem}\n", html: "<div class=\"wrap\" style=\"padding-bottom:2rem\">\n  <a class=\"back\" href=\"#/\">← Accueil<\/a>\n  <h1>Conseiller Nexus I<\/h1>\n  <p class=\"sub\">Analyse documentée de votre projet à partir des résultats du moteur et des références intégrées. Ce n’est <b>pas<\/b> une intelligence artificielle conversationnelle et il n’utilise pas Internet.<\/p>\n  <div class=\"card\">\n    <div class=\"field\"><label for=\"src\">Projet à analyser<\/label><select id=\"src\"><\/select><\/div>\n    <div class=\"field\"><label>Comparer avec les références de (facultatif)<\/label><div id=\"countries\"><\/div><p class=\"hint\">Les références comparent, elles ne remplacent jamais vos valeurs.<\/p><\/div>\n    <button class=\"btn\" id=\"go\" type=\"button\">Analyser<\/button>\n    <p class=\"note\" id=\"srcNote\"><\/p>\n  <\/div>\n  <div id=\"out\"><\/div>\n<\/div>" }, async (__req, __dyn, __nav, __search) => {
'use strict';
const { buildProjectData } = __req("js/project-form.js");
const { simulate, getReferentials } = __req("js/nexus-bridge.js");
const { listProjects } = __req("js/project-store.js");
const { loadDraft } = __req("js/draft-store.js");
const { esc } = __req("js/results-view.js");






const KEY = 'nouveau-projet';
const $ = (id) => document.getElementById(id);
const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 1 });
const num = (v) => v == null ? '—' : nf.format(v);
const fcfa = (v) => v == null ? '—' : nf.format(v) + ' FCFA';
const tag = (c, t) => `<span class="tag ${c}">${t}</span>`;
const T = { calc: tag('t-calc', 'Calculé'), alert: tag('t-alert', 'Alerte'), hyp: tag('t-hyp', 'Hypothèse'), adv: tag('t-adv', 'Conseil'), miss: tag('t-miss', 'Manque') };
const PARAM = { hatchPct: 'Taux d’éclosion', fertilizationPct: 'Taux de fécondation', survivalPct: 'Survie', rationPct: 'Ration journalière', fcr: 'FCR' };
const SPECIES = { clarias: 'Clarias', tilapia: 'Tilapia' };
const VERDICT = { conforme: 'dans la plage publiée', inferieur: 'inférieur à la référence', superieur: 'supérieur à la référence', critique: 'au-delà d’une borne publiée : à vérifier', divergent: 'références divergentes', non_comparable: 'non comparable', sans_reference: 'sans référence' };
const DIR = { dans_la_plage: 'dans la plage', au_dessus_de_la_borne_haute: 'au-dessus de la borne haute', sous_la_borne_basse: 'sous la borne basse' };
const section = (title, t, body, open) => `<details${open ? ' open' : ''}><summary>${t}<h2 style="display:inline">${esc(title)}</h2></summary><div class="body">${body}</div></details>`;
const ul = (a) => a?.length ? `<ul class="mini">${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
const label = (x) => `${esc(SPECIES[x.species] ?? x.species ?? '')} · ${esc(PARAM[x.parameter] ?? x.parameter)}${x.stage ? ' (' + esc(x.stage) + ')' : ''}`;
const none = (m) => `<p class="absent">${esc(m)}</p>`;

let sources = [];
async function loadSources() {
  sources = [];
  try { const d = await loadDraft(KEY); if (d?.value?.state) sources.push({ id: 'draft', label: 'Projet en cours (brouillon)', pd: () => buildProjectData(d.value.state) }); } catch {}
  try { for (const p of await listProjects()) sources.push({ id: 'p:' + p.id, label: p.name, pd: () => buildProjectData(p.state) }); }
  catch { $('srcNote').textContent = 'Projets enregistrés indisponibles sur cet appareil (stockage local bloqué).'; }
  sources.push({ id: 'demo', label: 'Projet fictif d’essai (valeurs fictives, sans valeur de référence)', pd: async () => (await __dyn("nexus-i/examples/example-project.js")).exampleProject() });
  $('src').innerHTML = sources.map((s) => `<option value="${esc(s.id)}">${esc(s.label)}</option>`).join('');
}

function render(res, pd, withRefs) {
  if (res.interfaceError) return `<div class="card status bad"><strong>Erreur d’interface</strong>${esc(res.interfaceError.code)} : ${esc(res.interfaceError.message)}</div>`;
  const r = res.raw, v = res.view, R = r.results ?? {}, fin = R.financial;
  const items = r.referenceAdvice?.items ?? [];
  const cmp = (k) => items.filter((i) => i.verdict === k);
  const toCheck = ['critique', 'superieur', 'inferieur', 'divergent'].flatMap(cmp);
  const alerts = r.alerts ?? [], crit = alerts.filter((a) => a.level === 'critical'), warn = alerts.filter((a) => a.level === 'warning');
  const blocking = [...(r.errors ?? []).map((e) => e.message), ...(r.missing ?? []).filter((m) => m.blocking).map((m) => m.message + ' (' + m.path + ')')];
  const optional = (r.missing ?? []).filter((m) => !m.blocking);
  let h = `<div class="card status ${v.tone}"><strong>${esc(v.title)}</strong><div class="note">Calcul exécuté : <b>${v.calculationExecuted ? 'oui' : 'non'}</b> · Validé : <b>non</b> · Fondé sur des hypothèses : <b>${v.basedOnAssumptions ? 'oui' : 'non'}</b>. Ce conseil décrit ce que le calcul et les références montrent ; ce n’est pas une validation scientifique ni un avis financier.</div></div>`;
  h += `<div class="card"><div class="kpi"><div><b>${crit.length}</b><span>alertes critiques</span></div><div><b>${warn.length}</b><span>alertes à surveiller</span></div><div><b>${blocking.length}</b><span>données obligatoires manquantes</span></div><div><b>${optional.length}</b><span>données facultatives manquantes</span></div><div><b>${toCheck.length}</b><span>paramètres à vérifier</span></div><div><b>${v.unvalidatedCount}</b><span>hypothèses non validées</span></div></div></div>`;

  // Points forts : uniquement ce que le moteur montre
  const strong = [];
  cmp('conforme').forEach((x) => strong.push(`${label(x)} : votre valeur (${esc(x.userValue)} ${esc(x.userUnit ?? '')}) est dans la plage publiée (${esc(x.advice?.referenceValue ?? '—')}) — confiance ${esc(x.confidence ?? '—')}.`));
  (R.capacity?.check?.rows ?? []).filter((c) => c.status === 'ok').forEach((c) => strong.push(`Capacité suffisante pour ${esc(c.key)} : ${num(c.utilizationPct)} % d’utilisation.`));
  if (fin) {
    const pr = fin.profitability.consolidated, pb = fin.cashFlow.payback;
    if (pr.resultAfterFinancialChargesFcfa > 0) strong.push(`Résultat économique estimé positif sur la période : ${fcfa(pr.resultAfterFinancialChargesFcfa)} (estimation non validée).`);
    if (pb?.recovered) strong.push(`Investissement récupéré dans la période estimée (mois ${esc(pb.month)}) — estimation non validée.`);
  }
  h += section('Points forts', T.calc, strong.length ? strong.map((s) => `<div class="item info">${s}</div>`).join('') : none('Aucun point fort identifiable avec les données et les références disponibles.'), true);

  // Insuffisances et paramètres à vérifier
  let weak = '';
  if (blocking.length) weak += `<p class="note"><b>À corriger pour que le calcul aboutisse</b></p>` + blocking.map((b) => `<div class="item critical">${esc(b)}</div>`).join('');
  if (crit.length || warn.length) weak += `<p class="note"><b>Alertes du moteur</b></p>` + [...crit, ...warn].map((a) => `<div class="item ${a.level}">${esc(a.message)}<div class="note">${esc(a.path ?? '')}</div></div>`).join('');
  (R.capacity?.check?.rows ?? []).filter((c) => !['ok', 'unknown'].includes(c.status)).forEach((c) => { weak += `<div class="item warning"><b>Capacité : ${esc(c.key)}</b> — requis ${num(c.required)}, capacité ${num(c.capacity)} (${num(c.utilizationPct)} %), statut « ${esc(c.status)} ».</div>`; });
  if (!fin && !blocking.length) weak += none(v.financialAbsentReason ?? 'Résultats financiers non calculés.');
  h += section('Insuffisances', T.alert, weak || none('Aucune insuffisance signalée par le moteur.'), true);

  // Paramètres à vérifier et écarts documentés
  let chk = '';
  if (!withRefs) chk = none('Aucune comparaison : cochez un ou plusieurs pays de référence puis appuyez sur « Analyser ».');
  else if (!toCheck.length) chk = '<p class="note">Aucun écart à signaler avec les références sélectionnées.</p>';
  for (const x of toCheck) {
    const a = x.advice, d = x.deviation;
    chk += `<div class="item warning"><b>${label(x)}</b> — ${esc(VERDICT[x.verdict])}
      <div class="note">Votre valeur : ${esc(x.userValue)} ${esc(x.userUnit ?? '')} · Référence : ${esc(a?.referenceValue ?? '—')}${d ? ` · Écart : ${num(d.absolute)} (${num(d.relativePct)} %), ${esc(DIR[d.direction] ?? d.direction)}` : ''}</div>
      ${a?.problem ? `<div>${esc(a.problem)}</div>` : ''}
      <div class="note"><b>Conséquences possibles</b></div>${ul(a?.possibleConsequences)}
      <div class="note"><b>Actions correctives documentées</b></div>${ul(a?.correctiveActions)}
      <div class="note"><b>Précautions</b></div>${ul(a?.precautions)}
      <div class="note">Confiance : ${esc(x.confidence ?? '—')}${x.bestComparability === 'faible' ? ' · comparabilité faible : conseil indicatif' : ''}</div></div>`;
  }
  const nc = cmp('non_comparable'), sr = cmp('sans_reference');
  if (withRefs && (nc.length || sr.length)) chk += `<p class="note">${nc.length} paramètre(s) non comparable(s), ${sr.length} sans référence dans les pays choisis : vos valeurs sont conservées telles quelles.</p>` + nc.map((x) => `<div class="item info">${label(x)} — ${esc(x.message)}</div>`).join('');
  h += section('Paramètres à vérifier et écarts avec les références', T.adv, chk, true);

  h += section(`Données manquantes facultatives (${optional.length})`, T.miss, optional.length ? optional.map((m) => `<div class="item info">${esc(m.message)} <span class="note">${esc(m.path)}</span></div>`).join('') : none('Aucune.'));
  h += section('Précautions', T.hyp, `<ul class="mini"><li>${v.unvalidatedCount} paramètre(s) sont des hypothèses non validées : les résultats sont des estimations.</li><li>Les références comparent, elles ne remplacent jamais vos saisies.</li><li>Une comparabilité « faible » rend le conseil indicatif.</li><li>Vérifiez les paramètres signalés avec un technicien avant toute décision d’investissement.</li></ul>`);
  return h;
}

async function run() {
  const src = sources.find((s) => s.id === $('src').value); if (!src) return;
  $('out').innerHTML = '<p class="note">Analyse en cours…</p>';
  try {
    const pd = await src.pd();
    const countries = [...document.querySelectorAll('#countries input:checked')].map((i) => i.value);
    const opt = countries.length ? { referenceSelection: { countries, species: pd.project?.species ?? [], includeOtherOrigins: false } } : {};
    $('out').innerHTML = render(simulate(pd, opt), pd, countries.length > 0) + (src.id.startsWith('p:') || src.id === 'draft' ? '<p class="note"><a class="back" href="#/mes-projets">Modifier le projet dans Mes projets</a></p>' : '');
  } catch (err) { $('out').innerHTML = `<div class="card status bad"><strong>Analyse impossible</strong>${esc(err.message)}</div>`; }
}
$('go').addEventListener('click', run);
$('src').addEventListener('change', run);
(async () => {
  $('countries').innerHTML = getReferentials().map((c) => `<label class="${c.referencesCount ? '' : 'grey'}" style="margin-right:.7rem"><input type="checkbox" value="${esc(c.country)}" ${c.referencesCount ? '' : 'disabled'}> ${esc(c.country)} (${c.referencesCount})</label>`).join('');
  await loadSources(); run();
})();

});

les explications, les calculs et les recommandations de Nexus I. Il ne calcule rien lui-même.<\/li><\/ul><\/div><\/details><details><summary><h2 style=\"display:inline\">Créer un projet<\/h2><\/summary><div class=\"body\"><ol><li>Sur l’accueil, appuyez sur <b>Nouveau projet<\/b>.<\/li><li>Suivez les étapes avec <b>Suivant →<\/b> et <b>← Précédent<\/b> : Identification, Espèces, Biologie (Clarias et/ou Tilapia selon votre choix), Infrastructures, Alimentation, Énergie et charges, Investissements et financement, Vérification.<\/li><li>Vous pouvez revenir à n’importe quelle étape pour corriger.<\/li><\/ol><p>Votre saisie est conservée automatiquement sur l’appareil (brouillon), même si vous fermez l’application. <b>Recommencer à zéro<\/b> efface ce brouillon.<\/p><\/div><\/details>\n<details open><summary><h2 style=\"display:inline\">Démarrer mon projet de production (parcours guidé)<\/h2><\/summary><div class=\"body\"><p>Sur l’accueil, appuyez sur <b>DÉMARRER MON PROJET DE PRODUCTION<\/b>. Nexus I vous guide en cinq phases avec <b>Suivant →<\/b> et <b>← Précédent<\/b> ; votre saisie est enregistrée sur l’appareil, et <b>Reprendre ma saisie en cours<\/b> (accueil) vous y ramène.<\/p><ol><li><b>Objectif<\/b> : espèce, nombre d’alevins à vendre (sur la durée du projet, par mois ou par an), taille à la livraison, prix de vente.<\/li><li><b>Installations<\/b> : bassins existants (ou <b>Je n’ai encore aucune installation<\/b>), géniteurs, équipements, énergie et eau.<\/li><li><b>Budget et prix<\/b> : votre capital, puis aliments et charges. Pour chaque prix : <b>Mon prix<\/b>, <b>Prix Nexus I<\/b> ou <b>Nexus I modifié<\/b>. Les références Nexus I sont des estimations non vérifiées localement, jamais des prix garantis.<\/li><li><b>Analyse<\/b> : <b>Lancer l’analyse →<\/b> ; Nexus I présente faisabilité, bassins, équipements, aliment, eau, énergie, investissement et charges, chacun avec son explication.<\/li><li><b>Comparaison<\/b> : trois scénarios calculés — A adapté au budget, B optimisé à moindre coût, C renforcé — avec statut, avantages, limites et recommandations.<\/li><\/ol><p><b>Statuts<\/b> : « Objectif atteint », « Objectif partiellement réalisable », « Objectif non réalisable avec les contraintes actuelles », « Calcul impossible faute de données suffisantes ». Nexus I ne modifie jamais votre objectif en silence.<\/p><p>Modifiez un prix, un bassin, un équipement ou une hypothèse de scénario : les trois scénarios sont recalculés, et les valeurs « Proposé par Nexus I » et « modifié par vous » restent distinguées. <b>Enregistrer ce scénario comme projet<\/b> le range dans Mes projets.<\/p><p><b>Ce sont des prévisions, pas des garanties.<\/b> Faites valider le projet par un technicien et obtenez des devis locaux.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Renseigner les données<\/h2><\/summary><div class=\"body\"><ul><li>Rien n’est rempli à votre place : aucune valeur de référence n’est appliquée automatiquement.<\/li><li>Les champs facultatifs peuvent rester vides. Une donnée obligatoire manquante est signalée et bloque les résultats financiers concernés.<\/li><li>Les unités sont indiquées à côté de chaque champ.<\/li><\/ul><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Enregistrer et gérer vos projets<\/h2><\/summary><div class=\"body\"><p>À l’étape Vérification, appuyez sur <b>Enregistrer comme projet<\/b>. Dans <b>Mes projets<\/b> vous pouvez : <b>Ouvrir<\/b>, voir les <b>Résultats<\/b>, <b>Dupliquer<\/b>, <b>Renommer<\/b>, <b>Exporter<\/b>, <b>Supprimer<\/b> (après confirmation) et consulter les <b>Simulations<\/b> déjà calculées. Les dates de création et de modification sont affichées.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Calculer et lire les résultats<\/h2><\/summary><div class=\"body\"><p>À l’étape Vérification, appuyez sur <b>Vérifier et calculer avec Nexus I<\/b>, puis <b>Ouvrir l’analyse détaillée<\/b>. Les rubriques regroupent production, aliments, énergie, capacités, investissements, charges, résultat, trésorerie, scénarios et sensibilité. <b>Recalculer<\/b> relance le calcul ; le taux d’actualisation (facultatif) permet la VAN et le TRI.<\/p><p>Les étiquettes distinguent : <b>Saisi<\/b> (vos données), <b>Calculé<\/b>, <b>Alerte<\/b>, <b>Hypothèse<\/b>, <b>Conseil<\/b>, <b>Manque<\/b>.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Comprendre le statut du calcul<\/h2><\/summary><div class=\"body\"><ul><li><b>Données invalides<\/b> : calcul bloqué, aucun résultat financier.<\/li><li><b>Données obligatoires manquantes<\/b> : les résultats financiers ne sont pas calculés ; la liste « À corriger » indique quoi renseigner.<\/li><li><b>Calcul exécuté — estimation non validée<\/b> : cas normal ; les résultats reposent sur vos hypothèses.<\/li><li><b>Paramètres marqués validés<\/b> : les résultats restent des estimations.<\/li><\/ul><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Interpréter les alertes<\/h2><\/summary><div class=\"body\"><p><b>Critiques<\/b> : à traiter en priorité. <b>À surveiller<\/b> : situation à vérifier (ex. alevins vendables après la fin de la période). <b>Informations<\/b> : précisions sur le calcul.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Utiliser les référentiels<\/h2><\/summary><div class=\"body\"><p>Dans l’analyse, cochez un ou plusieurs pays : vos valeurs sont comparées à des références publiées. Le verdict (dans la plage, inférieur, supérieur…) et le niveau de confiance sont indiqués ; si la comparabilité est faible, le conseil est <b>indicatif<\/b>. Les pays à 0 référence sont grisés. Vos valeurs ne sont jamais remplacées.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Analyser mon investissement<\/h2><\/summary><div class=\"body\"><p>Ce parcours ouvre le même assistant, dans l’ordre d’une étude économique : investissement initial, dépenses, marché, puis la production, <b>obligatoire<\/b> car le moteur ne peut pas chiffrer le chiffre d’affaires, l’aliment et l’énergie sans elle. Aucune valeur « type » n’est proposée : vous saisissez vos devis. Le projet peut être enregistré et complété plus tard.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Le Conseiller Nexus I<\/h2><\/summary><div class=\"body\"><p>Il lit les résultats du moteur et les références pour présenter : points forts, insuffisances, alertes, données manquantes, paramètres à vérifier, écarts avec les références, conséquences possibles et actions correctives <b>documentées<\/b>. Quand les références ne documentent rien, il l’indique. Il ne dialogue pas et n’utilise pas Internet.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Sauvegarder, exporter, importer<\/h2><\/summary><div class=\"body\"><p>Les projets sont stockés sur l’appareil, y compris hors connexion. Si vous effacez les données du navigateur, ils disparaissent : <b>exportez régulièrement<\/b>. Dans Mes projets, <b>Exporter<\/b> (un projet) ou <b>Exporter tout<\/b> crée un fichier JSON. Pour changer de téléphone, copiez ce fichier puis utilisez <b>Importer…<\/b> : l’import crée de <b>nouveaux<\/b> projets et n’écrase jamais les existants.<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Utiliser hors connexion et installer sur Android<\/h2><\/summary><div class=\"body\"><ol><li>Ouvrez l’adresse web (HTTPS) de L’EXPERT dans Chrome, <b>une première fois avec Internet<\/b>.<\/li><li>Menu ⋮ de Chrome → <b>Installer l’application<\/b> (ou « Ajouter à l’écran d’accueil »).<\/li><li>Ensuite, calculs, projets et résultats fonctionnent sans connexion.<\/li><\/ol><p>Ouvrir les fichiers directement depuis le gestionnaire de fichiers n’est pas pris en charge (le stockage et les calculs en dépendent d’une adresse web).<\/p><\/div><\/details>\n<details><summary><h2 style=\"display:inline\">Limites actuelles<\/h2><\/summary><div class=\"body\"><ul><li>Non développé dans le moteur : lots successifs, renouvellement des géniteurs, modèle de croissance, inflation, fiscalité, valeur résiduelle.<\/li><li>Pas d’export PDF.<\/li><li>Références limitées à certains pays et paramètres.<\/li><\/ul><\/div><\/details>\n<\/div>" }, async (__req, __dyn, __nav, __search) => {
'use strict';

/* Les trois scénarios sont réellement calculés par runScenarios() (moteur Nexus I). Les « valeurs initiales » servent de point de comparaison
   quand l'utilisateur a modifié des hypothèses : elles viennent d'un second calcul réel, sans ses modifications. */
function computeRes() {
  const sc = runScenarios(A, ctx()); const cmp = compareScenarios(sc); const adv = adviseScenarios(sc);
  const hasOv = ['A', 'B', 'C'].some((k) => Object.values(A.scenarioOverrides?.[k] ?? {}).some(Number.isFinite));
  const base = hasOv ? runScenarios(A, { ...ctx(), scenarioOverrides: {} }) : null;
  return { sc, cmp, adv, base };
}

/* Saisies des bassins : nombre existant = entier ≥ 0 ; dimensions = nombres > 0. Retourne un message si la valeur est refusée (elle n'est alors pas enregistrée). */
function checkInfraInput(t) {
  const m = /^infra\.[^.]+\.(existing\.count|dims\.(lengthM|widthM|usefulDepthM))$/.exec(t.dataset.a || '');
  if (!m) return null;
  const raw = String(t.value ?? '').trim(), isCount = m[1] === 'existing.count';
  const name = isCount ? 'Nombre de bassins existants' : ({ lengthM: 'La longueur', widthM: 'La largeur', usefulDepthM: 'La profondeur utile' })[m[2]];
  if (t.validity && t.validity.badInput) return isCount ? `${name} : écrivez un nombre entier (par exemple 2), sans lettres.` : `${name} : écrivez un nombre en mètres (par exemple 4,5), sans lettres.`;
  if (raw === '') return null;
  const v = num(raw);
  if (v === undefined) return isCount ? `${name} : écrivez un nombre entier (par exemple 2), sans lettres.` : `${name} : écrivez un nombre en mètres (par exemple 4,5), sans lettres.`;
  if (isCount) return v >= 0 && Number.isInteger(v) ? null : `${name} : indiquez un nombre entier, 0 ou plus (par exemple 2). Valeur refusée : ${esc(raw)}.`;
  return v > 0 ? null : `${name} doit être supérieure à 0 (en mètres). Valeur refusée : ${esc(raw)}.`;
}

async function saveScenario(k) {

'use strict';
const { simulate, getReferentials, engineInfo } = __req("js/nexus-bridge.js");
const { resultsHtml, esc } = __req("js/results-view.js");




const $ = (id) => document.getElementById(id);
let project = null;
async function loadProject() {
  // Projet FICTIF fourni avec le moteur (chiffres de démonstration, pas des références).
  const mod = await __dyn("nexus-i/examples/example-project.js");
  project = mod.exampleProject();
}

function renderCountries() {
  const list = getReferentials();
  $('countries').innerHTML = list.map((c) =>
    `<label class="${c.referencesCount ? '' : 'grey'}"><input type="checkbox" value="${esc(c.country)}" ${c.referencesCount ? '' : 'disabled'}> ${esc(c.country)} (${c.referencesCount})</label>`).join('') || '<span class="note">Référentiels indisponibles.</span>';
}

function options() {
  const countries = [...document.querySelectorAll('#countries input:checked')].map((i) => i.value);
  const o = {};
  if (countries.length) o.referenceSelection = { countries, species: project.project.species, includeOtherOrigins: $('otherOrigins').checked };
  const rate = $('rate').value.trim();
  if (rate !== '' && Number(rate) >= 0) o.finance = { discountRateAnnualPct: Number(rate) };
  return o;
}

async function run() {
  $('run').disabled = true;
  try { if (!project) await loadProject(); $('out').innerHTML = resultsHtml(simulate(project, options()), project); }
  catch (err) { $('out').innerHTML = `<div class="card status bad"><strong>Projet fictif introuvable</strong>${esc(err.message)}</div>`; }
  finally { $('run').disabled = false; }
}
$('engineLine').textContent = `${engineInfo.name} · version de travail ${engineInfo.version} (non publiée, non validée) · calcul local, aucune connexion requise`;
renderCountries();
$('run').addEventListener('click', run);
run();

});


render();
})();
</script>
</body>
</html>
